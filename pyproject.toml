[project]
name = "little-maia2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp[speedups]>=3.13.3",
    "einops==0.8.0",
    "gdown>=6.0.0",
    "jupyterlab>=4.5.7",
    "mlflow>=3.12.0",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "psutil>=7.2.2",
    "python-chess>=1.999",
    "pyyaml>=6.0.3",
    "pyzstd>=0.19.1",
    "requests>=2.32.5",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "tqdm>=4.67.3",
]
 
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maia2/*"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
maia2 = { path = "./maia2", editable = true }
