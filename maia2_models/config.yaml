# General Settings
# data_root: "/datadrive2/lichess_data"
data_root: "./maia2_data"
test_data_root: "./test_data"
seed: 42
num_workers: 16
verbose: 1
max_epochs: 3
max_ply: 300
clock_threshold: 30
chunk_size: 20000

# Data Filtering Settings
start_year: 2013
start_month: 5
end_year: 2026
end_month: 4
elo_upper_bound: 1200
elo_lower_bound: 400

# Async downloader (politeness to lichess.org)
download_workers: 4
max_concurrent_requests: 4
request_timeout_seconds: 60
download_max_retries: 3
download_max_throttle_retries: 10
month_failure_backoff_seconds: 30

from_checkpoint: false
checkpoint_epoch: 0
checkpoint_year: 2018
checkpoint_month: 5
checkpoint_run_id: ""
num_cpu_left: 16
queue_length: 2

# Training Parameters
lr: 0.0001
wd: 0.00001
batch_size: 8192
first_n_moves: 10
last_n_moves: 10

# Model Architecture
dim_cnn: 256
dim_vit: 1024
num_blocks_cnn: 5
num_blocks_vit: 2
input_channels: 18
vit_length: 8
elo_dim: 128

# Feature and Loss Settings
side_info: true
side_info_coefficient: 1.0
value: true
value_coefficient: 1.0
max_games_per_elo_range: 20

# MLflow Tracking / Model Registry
tracking_enabled: true
tracking_uri: "./mlruns"
experiment_name: "maia2_blitz"
registered_model_name: "MAIA2Blitz"
